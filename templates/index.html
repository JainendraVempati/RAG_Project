<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAG Assistant</title>

    <link rel="stylesheet" href="/static/style.css">

</head>
<body>

<div class="container">

    <h1>RAG Assistant</h1>
    <p class="subtitle">Upload a document and ask questions from it, the web, or both.</p>

    <hr>



    <h2>Upload Document</h2>

    <form id="uploadForm">

        
        <input type="file" id="documentFile" accept=".pdf">

        <button type="submit">Upload</button>

    </form>
    <div id="message"></div>

    <hr>


    <h2>Select Document</h2>

    <select id="documentSelect">
  
        <option value="">-- Select a Document --</option>
    </select>

    <hr>

  

    <h2>Ask a Question</h2>

    <select id="mode">
        <option value="document">Document</option>
        <option value="web">Web</option>
        <option value="both">Both</option>
    </select>

    <textarea id="question" rows="4" placeholder="Type your question here..."></textarea>

    <button id="askBtn">Ask</button>

    <h2>Answer</h2>

    <div id="answer">Your answer will appear here...</div>

</div>


<div id="webSearchModal" class="modal-overlay hidden">

    <div class="modal-box">

        <p id="modalMessage">The selected document is not available.</p>

        <p class="modal-subtext">Would you like to search the web instead?</p>

        <div class="modal-actions">

            <button id="searchWebBtn">Search Web</button>

            <button id="cancelModalBtn" class="secondary">Cancel</button>

        </div>

    </div>

</div>

<script src="/static/script.js"></script>

</body>
</html>
